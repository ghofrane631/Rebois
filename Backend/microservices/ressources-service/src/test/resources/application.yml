# Configuration des tests : H2 en mémoire, sans Eureka, Config Server ni RabbitMQ.
spring:
  application:
    name: ressources-service
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
  datasource:
    url: jdbc:h2:mem:ressources_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false

ressources:
  reserve-minimale-camions: 1
  donnees-demo: false
  outbox:
    publisher-enabled: false
