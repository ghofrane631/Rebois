# =====================================================================
# ms-signalement — configuration locale
# Les valeurs peuvent être surchargées par le Config Server (signalement.yml)
# puis par les variables d'environnement indiquées entre ${...}.
# =====================================================================

server.port=8083
server.shutdown=graceful

spring.application.name=signalement
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# --- MongoDB ---
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/signalement_db}
# crée les index (2dsphere, statut, outbox)
spring.data.mongodb.auto-index-creation=true

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
# message rejeté -> DLQ au lieu d'une boucle infinie
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=20
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s

# --- Sécurité (JWT Keycloak) ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_URL:http://localhost:8180}/realms/forest-fire-watch/protocol/openid-connect/certs

# --- OpenFeign ---
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=3000
spring.cloud.openfeign.client.config.default.logger-level=basic

spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Eureka ---
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.registry-fetch-interval-seconds=5

# --- Resilience4j — appel ms-foret ---
# le circuit breaker englobe les retries
resilience4j.circuitbreaker.circuit-breaker-aspect-order=1
resilience4j.circuitbreaker.instances.foret.sliding-window-size=10
resilience4j.circuitbreaker.instances.foret.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.foret.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.foret.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.foret.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.foret.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.retry.retry-aspect-order=2
resilience4j.retry.instances.foret.max-attempts=3
resilience4j.retry.instances.foret.wait-duration=300ms
resilience4j.retry.instances.foret.retry-exceptions[0]=feign.RetryableException
resilience4j.retry.instances.foret.retry-exceptions[1]=java.util.concurrent.TimeoutException

# --- Outbox ---
app.outbox.publisher-delay-ms=5000

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.persist-authorization=true
springdoc.show-actuator=false
