server:
  port: 8083

spring:
  application:
    name: signalement          # fichier config-repo : signalement.yml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}   # dev = sécurité ouverte (avant S8)
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/signalement_db}
      auto-index-creation: true            # crée l'index 2dsphere
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/forest-fire-watch/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
