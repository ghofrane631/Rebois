# Configuration centralisée de ressources-service, servie par le config-server.
server:
  port: 8085

spring:
  # Base propre au service : ressources_db (aucune table partagée)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ressources_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    connection-timeout: 2s
    listener:
      simple:
        default-requeue-rejected: false   # après les essais : dead-letter queue
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
    healthcheck:
      enabled: true          # le statut de /actuator/health est publié dans Eureka
  instance:
    prefer-ip-address: true
    # Un identifiant par instance : permet de lancer 2 instances (ports différents)
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true        # /actuator/health/liveness et /readiness
  health:
    rabbit:
      # Sans RabbitMQ lancé, l'indicateur rabbit est DOWN et healthcheck rendrait
      # l'instance DOWN dans Eureka (la Gateway ne la proposerait plus).
      enabled: ${RABBIT_HEALTH:true}
  info:
    env:
      enabled: true

info:
  application:
    nom: ressources-service
    description: Forest Fire Watch - Service 5 Ressources (moyens de lutte)
    version: 0.0.1

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Règles métier configurables
ressources:
  reserve-minimale-camions: 1
  donnees-demo: true
  outbox:
    publisher-enabled: true
    delai-ms: 2000
