server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

spring:
  cloud:
    gateway:
      routes:
        # Service 5 : Ressources
        - id: ressources-service
          uri: lb://ressources-service
          predicates:
            - Path=/api/ressources/**

        # Ajouter ici les routes des autres services de l'équipe, par exemple :
        # - id: foret-service
        #   uri: lb://foret-service
        #   predicates:
        #     - Path=/api/forets/**, /api/secteurs/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:4200"
            allowed-methods: "*"
            allowed-headers: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
