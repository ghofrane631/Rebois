# Configuration centralisée de ms-signalement (lue par le Config Server).
# Les variables d'environnement restent prioritaires (docker-compose les fournit).
server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: signalement
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/signalement_db}
      auto-index-creation: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8180}/realms/forest-fire-watch/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

app:
  outbox:
    publisher-delay-ms: ${OUTBOX_DELAY_MS:5000}

logging:
  level:
    com.esprit.ffw.signalement: INFO
    org.springframework.amqp: WARN
    feign: INFO
