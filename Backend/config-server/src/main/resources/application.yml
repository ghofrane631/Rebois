server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: ${CONFIG_PROFILE:native}
  cloud:
    config:
      server:
        # Profil natif : lit Backend/config-repo sur le disque (aucun dépôt Git requis en dev).
        native:
          search-locations: ${CONFIG_REPO_PATH:file:../config-repo}
        # Profil git : CONFIG_PROFILE=git, CONFIG_GIT_URI=... pour la version centralisée sur GitHub.
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/thourayaallagui/reboisTN}
          search-paths: Backend/config-repo
          default-label: main

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
